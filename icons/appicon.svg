<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cleanCanvasBg" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Master Tile Gradient -->
    <linearGradient id="cleanTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="30%" stop-color="#00a8ff" />
      <stop offset="68%" stop-color="#0051ff" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Specular Rim -->
    <linearGradient id="cleanRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#a5f3fc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0051ff" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" fill="url(#cleanCanvasBg)" />

  <!-- Corner Ambient Accents -->
  <g opacity="0.14">
    <rect x="42" y="42" width="96" height="96" rx="20" fill="#00f0ff" />
    <rect x="374" y="42" width="96" height="96" rx="20" fill="#6d28d9" />
    <rect x="42" y="374" width="96" height="96" rx="20" fill="#3b82f6" />
    <rect x="374" y="374" width="96" height="96" rx="20" fill="#00f5ff" />
  </g>

  <!-- Vector Drop Shadows (Replacing unsupported <filter>) -->
  <rect x="76" y="94" width="360" height="360" rx="72" fill="#000000" opacity="0.55" />
  <rect x="76" y="84" width="360" height="360" rx="72" fill="#0051ff" opacity="0.25" />

  <!-- Master 2048 Tile -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#cleanTileGrad)" />

  <!-- Specular Chamfered Rim -->
  <rect x="78" y="78" width="356" height="356" rx="70" fill="none" stroke="url(#cleanRimGrad)" stroke-width="4" />

  <!-- Glossy Glass Curvature Highlight -->
  <path d="M 80 152 C 80 110, 110 80, 152 80 L 360 80 C 402 80, 432 110, 432 152 C 340 180, 172 180, 80 152 Z" fill="#ffffff" opacity="0.18" />


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian / Navy Chassis Gradient -->
    <radialGradient id="canvasBg" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Electric Cyan to Royal Sapphire & Violet Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="30%" stop-color="#00a8ff" />
      <stop offset="68%" stop-color="#0051ff" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Crystalline Ice-White Specular Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#a5f3fc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0051ff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Multi-tier Neon Bloom & Deep Ambient Drop Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00f0ff" flood-opacity="0.4" />
    </filter>

    <filter id="textDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#031536" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Squircle Chassis -->
  <rect width="512" height="512" rx="112" fill="url(#canvasBg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="2" />

  <!-- Subtle Cyan / Purple Ambient Corner Accents -->
  <g opacity="0.14">
    <rect x="42" y="42" width="96" height="96" rx="20" fill="#00f0ff" />
    <rect x="374" y="42" width="96" height="96" rx="20" fill="#6d28d9" />
    <rect x="42" y="374" width="96" height="96" rx="20" fill="#3b82f6" />
    <rect x="374" y="374" width="96" height="96" rx="20" fill="#00f5ff" />
  </g>

  <!-- Hero 2048 Master Tile -->
  <g filter="url(#tileShadow)">
    <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#tileGrad)" />
  </g>

  <!-- Specular Chamfered Rim -->
  <rect x="78" y="78" width="356" height="356" rx="70" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Glossy Glass Curvature Highlight -->
  <path d="M 80 152 C 80 110, 110 80, 152 80 L 360 80 C 402 80, 432 110, 432 152 C 340 180, 172 180, 80 152 Z" fill="#ffffff" opacity="0.18" />

  <!-- Cyan Glint Star -->
  <g transform="translate(132, 132)">
    <circle cx="0" cy="0" r="16" fill="#00f5ff" opacity="0.3" />
    <path d="M -18 0 Q 0 0 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Sculpted Pure White Numerals -->
  <text x="256" y="264" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="124" font-weight="900" letter-spacing="-3" filter="url(#textDepth)">2048</text>
</svg>